// App Android de gba-port: el telefono genera el C del juego desde la ROM del usuario (biblioteca del generador, Rust) y lo compila
// en memoria con libtcc al arrancar; el runtime va compilado en libmain.so (ver android/README.md).
plugins {
    id 'com.android.application'
}

def repo = rootProject.file('..').canonicalPath
def sdl = rootProject.file(providers.gradleProperty('gbaPort.sdlDir').get()).canonicalPath
def tinycc = rootProject.file(providers.gradleProperty('gbaPort.tinycc').get()).canonicalPath
def profile = rootProject.file(providers.gradleProperty('gbaPort.profile').get())
def gameDir = new File(profile.parentFile, profile.name - '.toml').canonicalPath
def gameAssets = layout.buildDirectory.dir('generated/gameAssets')

android {
    namespace 'io.github.alekaydevs.gbaport'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId providers.gradleProperty('gbaPort.applicationId').get()
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1'
        // Direccion de la ultima release (API de GitHub) para el aviso de version nueva; vacia: la app no busca nada.
        resValue 'string', 'update_url', providers.gradleProperty('gbaPort.updateUrl').getOrElse('')
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments "-DGBA_RECOMP_DIR=${repo}", "-DSDL2_DIR=${sdl}", "-DTINYCC_DIR=${tinycc}", "-DGBA_GAME_DIR=${gameDir}",
                        "-DGBA_GEN_LIB=${repo}/target/aarch64-linux-android/release/libgba_recomp.a"
            }
        }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    lint { checkReleaseBuilds false }
    // La firma de las versiones: la clave NO esta en el repositorio. Va en ~/.gradle/gradle.properties:
    //   gbaPort.keystore=/ruta/a/gba-port.jks  gbaPort.keystorePassword=...  gbaPort.keyAlias=...  gbaPort.keyPassword=...
    // Sin ella, assembleRelease firma con la clave de depuracion (solo para probar, no se reparte).
    def haveKey = providers.gradleProperty('gbaPort.keystore').isPresent()
    signingConfigs {
        if (haveKey) {
            release {
                storeFile file(providers.gradleProperty('gbaPort.keystore').get())
                storePassword providers.gradleProperty('gbaPort.keystorePassword').get()
                keyAlias providers.gradleProperty('gbaPort.keyAlias').get()
                keyPassword providers.gradleProperty('gbaPort.keyPassword').get()
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            if (haveKey) signingConfig signingConfigs.release
            else {
                signingConfig signingConfigs.debug
                logger.warn('AVISO: sin gbaPort.keystore, el APK de release va firmado con la clave de depuracion: no se reparte.')
            }
        }
    }
    packaging { jniLibs { useLegacyPackaging true } }
    sourceSets {
        main {
            java.srcDirs += "${sdl}/android-project/app/src/main/java"
            assets.srcDirs += gameAssets.get().asFile
        }
    }
}

// Lo que el telefono necesita para generar y compilar: el perfil y sus raices, y las cabeceras para TinyCC. Nada de la ROM.
tasks.register('gameAssets', Sync) {
    into gameAssets
    from("${tinycc}/include") { into 'tcc_include' }
    from("${rootProject.projectDir}/tcc_include") { into 'tcc_include' }
    from("${repo}/runtime") { include 'gba_rt.h'; into 'tcc_include' } // la interfaz del runtime: codigo propio
    from(profile) { into 'game'; rename { 'profile.toml' } }
    from(new File(profile.parentFile, 'dynamic_roots.txt')) { into 'game'; rename { 'roots.txt' } }
    from("${rootProject.projectDir}/NOTICE.txt") { into 'licenses' }
    from("${tinycc}/COPYING") { into 'licenses'; rename { 'libtcc-LGPL-2.1.txt' } }
    from("${sdl}/LICENSE.txt") { into 'licenses'; rename { 'SDL2-zlib.txt' } }
    doLast {
        // Android no lista carpetas de assets con rutas de ficheros: un indice para copiarlos.
        def root = gameAssets.get().asFile
        def lines = []
        root.eachFileRecurse { f -> if (f.isFile() && f.name != 'index.txt') lines << root.toPath().relativize(f.toPath()).toString().replace('\\', '/') }
        new File(root, 'index.txt').text = lines.sort().join('\n') + '\n'
    }
}

// El generador (Rust) como biblioteca estatica para arm64: no necesita el enlazador del NDK.
tasks.register('cargoGenerator', Exec) {
    workingDir repo
    commandLine 'cargo', 'rustc', '--release', '--lib', '--target', 'aarch64-linux-android', '--crate-type', 'staticlib'
}

tasks.named('preBuild') { dependsOn 'gameAssets', 'cargoGenerator' }
