org.gradle.jvmargs=-Xmx3g
android.useAndroidX=false
# Fuentes hermanas sin configurar: SDL2 2.32.x y TinyCC (rama mob, e23dabe) como en snes-recomp
gbaPort.sdlDir=../../SDL2-2.32.10
gbaPort.tinycc=../../tinycc
# El perfil del juego (su carpeta lleva dynamic_roots.txt y el C propio: text.c y options.c). El telefono genera el C del juego desde la ROM
# que elige el usuario (biblioteca del generador + libtcc): en el APK no hay nada derivado de la ROM.
gbaPort.profile=../../minishcap-recomp/games/minishcap_usa.toml
gbaPort.applicationId=io.github.alekaydevs.minishcaprecomp
# Ultima release para el aviso de version nueva (vacia: sin avisos ni Internet). El APK y su SHA256SUMS deben ir en la release.
gbaPort.updateUrl=https://api.github.com/repos/AlekayDevs/minishcap-recomp/releases/latest
